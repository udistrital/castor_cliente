<h2 mat-dialog-title>Acción sobre postulación</h2>

<div mat-dialog-content class="space-y-3">
  <div class="text-sm opacity-80" *ngIf="data?.estudianteNombre || data?.ofertaTitulo">
    <div *ngIf="data?.estudianteNombre"><b>Estudiante:</b> {{ data.estudianteNombre }}</div>
    <div *ngIf="data?.ofertaTitulo"><b>Oferta:</b> {{ data.ofertaTitulo }}</div>
  </div>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Acción</mat-label>
    <mat-select [formControl]="accionCtrl" [disabled]="loading">
      <mat-option *ngFor="let a of acciones" [value]="a.value">{{ a.label }}</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-full">
    <mat-label>Comentario (opcional)</mat-label>
    <textarea matInput rows="4" [formControl]="comentarioCtrl" [disabled]="loading"></textarea>
    <mat-hint>Puedes dejarlo vacío.</mat-hint>
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cerrar()" [disabled]="loading">Cancelar</button>
  <button mat-flat-button color="primary" (click)="confirmar()" [disabled]="loading">
    {{ loading ? 'Guardando...' : 'Confirmar' }}
  </button>
</div>
