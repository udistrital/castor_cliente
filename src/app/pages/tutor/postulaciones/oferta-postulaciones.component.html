<div class="min-h-screen bg-gradient-to-b from-slate-50 via-white to-slate-100">
  <div class="mx-auto flex max-w-5xl flex-col gap-6 px-4 py-8">
    <mat-card appearance="outlined" class="rounded-3xl border border-slate-200 bg-white/90 shadow-sm">
      <mat-card-content>
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">Detalle de oferta</p>
            <h1 class="text-3xl font-semibold text-slate-900">
              Oferta #{{ ofertaId || 'N/D' }}
            </h1>
            <p class="text-sm text-slate-600">
              Postulaciones recibidas y su estado actual.
            </p>
          </div>
          <button mat-stroked-button color="primary" (click)="goBack()">
            Volver al dashboard
          </button>
        </div>
      </mat-card-content>
    </mat-card>

    <div *ngIf="errorMessage" class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800">
      {{ errorMessage }}
    </div>

    <div *ngIf="loading" class="flex items-center justify-center rounded-3xl border border-slate-200 bg-white py-12">
      <mat-progress-spinner diameter="48" mode="indeterminate"></mat-progress-spinner>
    </div>

    <ng-container *ngIf="!loading && !errorMessage">
      <div class="grid gap-4 md:grid-cols-2">
        <ng-container *ngIf="postulaciones.length; else emptyPostulaciones">
            <mat-card
              *ngFor="let postulacion of postulaciones"
              appearance="outlined"
              class="rounded-2xl border border-slate-200 bg-white shadow-sm"
            >
              <mat-card-content>
                <div class="flex items-start justify-between gap-3">
                  <div>
                    <p class="text-xs text-slate-500">Postulacion #{{ getPostulacionId(postulacion) }}</p>
                    <h3 class="text-lg font-semibold text-slate-900">
                      {{ getPostulanteNombre(postulacion) }}
                    </h3>
                  </div>
                  <app-estado-chip [codigo]="getEstadoCodigo(postulacion)"></app-estado-chip>
                </div>
                <div class="mt-4">
                  <button mat-stroked-button color="primary" (click)="openAccionDialog(postulacion)">
                    Cambiar estado
                  </button>
                </div>
              </mat-card-content>
            </mat-card>
        </ng-container>
        <ng-template #emptyPostulaciones>
          <div class="col-span-full rounded-2xl border border-dashed border-slate-200 bg-slate-50 p-6 text-center text-sm text-slate-500">
            Aun no hay postulaciones para esta oferta.
          </div>
        </ng-template>
      </div>
    </ng-container>
  </div>
</div>
