<div class="p-6 max-w-2xl mx-auto">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        Registro de empresa
      </mat-card-title>
      <mat-card-subtitle>
        <ng-container *ngIf="tutorNombre; else sinNombre">
          Hola, {{ tutorNombre }}. Asocia tu empresa para continuar.
        </ng-container>
        <ng-template #sinNombre>
          Asocia tu empresa para continuar.
        </ng-template>
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="mt-4">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="grid gap-4">
        <mat-form-field appearance="outline">
          <mat-label>NIT (sin dígito de verificación)</mat-label>
          <input matInput formControlName="nit_sin_dv" autocomplete="off" />
          <mat-error *ngIf="form.controls.nit_sin_dv.invalid">
            NIT requerido
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Razón social</mat-label>
          <input matInput formControlName="razon_social" autocomplete="off" />
          <mat-error *ngIf="form.controls.razon_social.invalid">
            Razón social requerida
          </mat-error>
        </mat-form-field>

        <div class="flex gap-3 justify-end mt-2">
          <button mat-stroked-button type="button" (click)="onCancel()">
            Cancelar
          </button>
          <button mat-raised-button color="primary" type="submit">
            Guardar y continuar
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
